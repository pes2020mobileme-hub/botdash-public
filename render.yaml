# ทุกอย่างรันใน service เดียว: Discord bot + REST API + หน้าเว็บ
# Express เสิร์ฟทั้ง /api และ dashboard build จาก origin เดียวกัน
# จึงไม่ต้องมี CORS และไม่ต้องตั้ง VITE_API_URL
services:
  - type: web
    name: botdash
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DISCORD_TOKEN
        sync: false # ← ตั้งค่าใน Render Dashboard (อย่า commit ลง git)
      - key: DASHBOARD_TOKEN
        sync: false # ← สร้างด้วย: cd bot && npm run token
      - key: DEPLOY_COMMANDS
        value: "true"
      # ใส่ Guild ID เพื่อให้ slash command ขึ้นทันทีแทนรอถึง 1 ชั่วโมง
      - key: GUILD_ID
        sync: false
      - key: PREFIX
        value: "!"
      - key: STATUS
        value: online
      - key: ACTIVITY
        value: Watching the dashboard
      - key: OWNERS
        sync: false
