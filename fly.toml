# Fly.io — WebSocket ได้, ไม่ sleep, เหมาะกับ Discord bot ที่ต้องออนไลน์ตลอด
# ใช้: cd bot && fly launch --no-deploy แล้ว copy ไฟล์นี้ไปที่ bot/
app = "botdash-bot"
primary_region = "sin"

[build]
  dockerfile = "../Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  # DISCORD_TOKEN และ CORS_ORIGIN ให้ตั้งด้วย: fly secrets set DISCORD_TOKEN=... CORS_ORIGIN=...

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # ไม่ให้เครื่องหยุดเอง — สำคัญสำหรับบอท
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
